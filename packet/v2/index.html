// ─── UTC helpers ───
function nowUtc() { return new Date().toISOString(); }
function ageSec(ts) { if (!ts) return null; return Math.round((Date.now() - new Date(ts).getTime()) / 1000); }
function isoOk(ts) { return ts && !ts.includes('|') && !ts.includes('=') && ts.match(/^\d{4}-\d{2}-\d{2}T/); }

// ─── Source timestamp extraction ───
// Returns per-subsource metadata. Uses null when source observation time is unknown.
function extractSourceTimestamps(d) {
  const st = (d.status && d.status.source_timestamps) || {};
  const h = d.header || {};
  const packetTs = h.generated_timestamp || nowUtc();

  const out = {};

  // AMT — real-time, use provided stamp or null
  out.amt = {
    observed_at_utc: st.amt || null,
    collected_at_utc: packetTs,
    frequency_sec: 900
  };

  // VP — from source timestamp
  out.vp = {
    observed_at_utc: st.vp || null,
    collected_at_utc: packetTs,
    frequency_sec: 3600
  };

  // Pipeline (regime, macro, derivs, cycle) — from combined text
  const pipeRaw = st.pipeline || '';
  out.pipeline = {
    observed_at_utc: pipeRaw.replace(/^.*regime=([^\s|]+).*$/, '$1').replace(' UTC','') || null,
    collected_at_utc: packetTs,
    frequency_sec: 3600
  };

  // On-chain (brk/fetched_at)
  const brk = (d.reference && d.reference.brk) || {};
  out.onchain = {
    observed_at_utc: brk.fetched_at || null,
    collected_at_utc: packetTs,
    frequency_sec: 86400
  };

  // FRED / Yahoo / ETF — per-source timestamps unavailable
  out.fred = { observed_at_utc: null, collected_at_utc: packetTs, frequency_sec: 86400 };
  out.yahoo = { observed_at_utc: null, collected_at_utc: packetTs, frequency_sec: 3600 };
  out.etf = { observed_at_utc: null, collected_at_utc: packetTs, frequency_sec: 86400 };

  return out;
}

// ─── Metric row helper for telemetry brief ───
function metric(label, value, unit, source, freshness, note) {
  const fcls = freshness || 'unavailable';
  const suffix = note ? ` <span class="tag tag-${fcls === 'stale' ? 'stale' : fcls === 'unavailable' ? 'unavailable' : 'raw'}">${note}</span>` : '';
  const valCls = typeof value === 'number' ? (value > 0 ? 'positive' : value < 0 ? 'negative' : 'neutral') : '';
  let disp = value != null ? value : '—';
  if (typeof value === 'number') {
    if (Math.abs(value) < 0.01 && value !== 0) disp = value.toExponential(2);
    else if (Math.abs(value) < 1) disp = value.toFixed(4);
    else if (Math.abs(value) < 100) disp = value.toFixed(3);
    else disp = value.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (value > 0 && unit !== '%') disp = '+' + disp;
  }
  if (value == null) disp = '—';
  const srcTag = source ? ` <span style="font-size:0.7em;color:var(--muted)">[${source}]</span>` : '';
  const staleTag = fcls === 'stale' ? ' <span class="tag tag-stale">STALE</span>' : '';
  const unavTag = fcls === 'unavailable' && value == null ? ' <span class="tag tag-unavailable">UNAVAIL</span>' : '';
  return `<div class="metric-row"><span class="metric-label">${label}${srcTag}${staleTag}${unavTag}</span><span class="metric-value ${valCls}">${disp}${unit ? ' ' + unit : ''}${suffix}</span></div>`;
}

// ─── Build timestamp metadata block per metric ───
function tsMeta(observed, collected, packetTs, freq) {
  const calculatedAt = nowUtc();
  const age = observed && isoOk(observed) ?
    Math.round((new Date(calculatedAt).getTime() - new Date(observed).getTime()) / 1000) : null;

  // Freshness: null observed → unavailable. Only meaningful if value exists.
  let fclass = 'unavailable';
  if (observed && isoOk(observed) && age != null) {
    fclass = age < freq * 0.5 ? 'fresh' : age < freq * 2 ? 'delayed' : age < freq * 6 ? 'stale' : 'unavailable';
  }

  return {
    source_observed_at_utc: observed && isoOk(observed) ? observed : null,
    pipeline_snapshot_at_utc: observed ? null : packetTs,
    collected_at_utc: collected || packetTs,
    packet_generated_at_utc: packetTs,
    age_calculated_at_utc: calculatedAt,
    source_update_frequency_seconds: freq,
    age_seconds: age,
    freshness: fclass
  };
}

// ─── Build metric object for structured JSON ───
function m(value, unit, sourceKey, source, instrument, window_, dataType, calcId, deps, details) {
  // details: optional object for extra fields (current_value, previous_value, window_start_utc, etc.) copied into metric
  if (!sourceKey && !source) { sourceKey = 'amt'; source = 'Binance'; }
  const srcObj = srcTsCache[sourceKey] || { observed_at_utc: null, collected_at_utc: null, frequency_sec: 900 };

  const meta = tsMeta(srcObj.observed_at_utc, srcObj.collected_at_utc, packetTsSnapshot, srcObj.frequency_sec);

  // For AMT (aggregator bot): source_observed_at_utc is actually the aggregator snapshot,
  // not the original Binance observation time. Preserve it as aggregator_snapshot_at_utc.
  const isAggregator = (sourceKey === 'amt');
  const sourceObserved = isAggregator ? null : meta.source_observed_at_utc;
  const aggregatorSnapshot = isAggregator ? meta.source_observed_at_utc : null;

  // Null value NEVER fresh
  let freshness = meta.freshness;
  let eligible = true;
  if (value == null) {
    freshness = 'unavailable';
    eligible = false;
  } else if (!meta.source_observed_at_utc) {
    eligible = false;
  }

  const obj = {
    value: value != null ? value : null,
    unit: unit || null,
    source: source || null,
    source_identifier: sourceKey || null,
    instrument: instrument || null,
    window: window_ || null,
    source_observed_at_utc: sourceObserved,
    aggregator_snapshot_at_utc: aggregatorSnapshot,
    pipeline_snapshot_at_utc: meta.pipeline_snapshot_at_utc,
    collected_at_utc: meta.collected_at_utc,
    packet_generated_at_utc: meta.packet_generated_at_utc,
    age_calculated_at_utc: meta.age_calculated_at_utc,
    source_update_frequency_seconds: meta.source_update_frequency_seconds,
    age_seconds: meta.age_seconds,
    freshness: freshness,
    data_type: dataType || 'raw',
    formula: calcId || null,
    dependencies: deps || [],
    eligible_for_analysis: eligible
  };
  // Merge extra detail fields (current_value, previous_value, window_start_utc, etc.)
  if (details && typeof details === 'object') Object.assign(obj, details);
  return obj;
}

// ─── Globals for m() helper ───
let srcTsCache = {};
let packetTsSnapshot = '';


// ─── Parse heatmap text into structured clusters ───
function parseHeatmapClusters(text) {
  if (!text || typeof text !== 'string') return [];
  const clusters = [];
  const now = new Date().toISOString();

  // Parse: "Long: $64,500 (-0.03%), $64,300 (-0.34%) | Short: $64,500 (-0.03%), $64,600 (+0.13%)"
  const sideRegex = /(Long|Short):\s*(.+?)(?=\s*\|\s*(?:Long|Short)|$)/g;
  let match;
  while ((match = sideRegex.exec(text)) !== null) {
    const side = match[1].toLowerCase();
    const items = match[2].split(',').map(s => s.trim());
    for (const item of items) {
      const priceMatch = item.match(/\$([\d,]+)\s*\(([+-]?[\d.]+)%\)/);
      if (priceMatch) {
        clusters.push({
          side: side,
          price: parseFloat(priceMatch[1].replace(/,/g, '')),
          distance_pct: parseFloat(priceMatch[2]),
          strength: null,
          source: 'Coinglass',
          capture_timestamp_utc: null,
          data_type: 'estimated_cluster'
        });
      }
    }
  }
  return clusters;
}

// ─── Parse S/R text into structured level objects ───
function parseSrLevels(srText, timeframe, enrichedSupport, enrichedResistance) {
  // srText: "S: $64,237 / $63,988 / $63,726 | R: $64,706 / $65,097 / $65,250"
  const levels = [];
  const now = new Date().toISOString();

  if (!srText || typeof srText !== 'string') return levels;

  const sideRegex = /([SR]):\s*(.+?)(?=\s*\|\s*[SR]:|$)/g;
  let match;
  while ((match = sideRegex.exec(srText)) !== null) {
    const side = match[1] === 'S' ? 'support' : 'resistance';
    const prices = match[2].split('/').map(s => parseFloat(s.trim().replace(/[$,]/g, '')));
    for (let i = 0; i < prices.length; i++) {
      if (!isNaN(prices[i])) {
        levels.push({
          side: side,
          price: prices[i],
          timeframe: timeframe,
          method: 'calculated_swing_point',
          touch_count: null,
          first_observed_at_utc: null,
          last_tested_at_utc: null,
          calculated_at_utc: now,
          eligible_for_analysis: true
        });
      }
    }
  }

  // Add enriched single levels if available (these are the closest levels)
  if (enrichedSupport != null && !isNaN(enrichedSupport)) {
    // Check if already present
    if (!levels.some(l => l.side === 'support' && Math.abs(l.price - enrichedSupport) < 1)) {
      levels.push({
        side: 'support',
        price: enrichedSupport,
        timeframe: timeframe,
        method: 'nearest_swing_low',
        touch_count: null,
        first_observed_at_utc: null,
        last_tested_at_utc: null,
        calculated_at_utc: now,
        eligible_for_analysis: true
      });
    }
  }
  if (enrichedResistance != null && !isNaN(enrichedResistance)) {
    if (!levels.some(l => l.side === 'resistance' && Math.abs(l.price - enrichedResistance) < 1)) {
      levels.push({
        side: 'resistance',
        price: enrichedResistance,
        timeframe: timeframe,
        method: 'nearest_swing_high',
        touch_count: null,
        first_observed_at_utc: null,
        last_tested_at_utc: null,
        calculated_at_utc: now,
        eligible_for_analysis: true
      });
    }
  }

  return levels;
}



function buildBrief(d, srcTs) {
  const h = d.header || {}, c = d.critical || {}, ctx = d.context || {};
  const ref = d.reference || {}, enr = d.enriched || {};
  const reg = d.regime || {}, src = d.sources || {};
  const brk = ref.brk || {}, cyc = ref.cycle || {};
  const fresh = (k) => {
    const s = (srcTs && srcTs[k]) || {};
    const obs = s.observed_at_utc;
    if (!obs) return 'unavailable';
    const a = ageSec(obs);
    if (a == null) return 'unavailable';
    return a < s.frequency_sec * 0.5 ? 'fresh' : a < s.frequency_sec * 2 ? 'delayed' : a < s.frequency_sec * 6 ? 'stale' : 'unavailable';
  };

// ─── Traverse JSON tree to find all metric objects ───
function findMetricObjects(obj, path, results, visited, skipKeys) {
  if (!obj || typeof obj !== 'object' || visited.has(obj)) return;
  visited.add(obj);
  if (Array.isArray(obj)) {
    for (let i = 0; i < obj.length; i++)
      findMetricObjects(obj[i], path + '[' + i + ']', results, visited, skipKeys);
    return;
  }
  // A metric object has 'freshness' and 'data_type' and 'value' fields
  if (obj !== null && typeof obj === 'object' && 'freshness' in obj && 'data_type' in obj && 'value' in obj) {
    results.push({ path: path, obj: obj });
    return; // don't recurse into metric objects
  }
  // Recurse
  const skip = skipKeys || ['data_quality', 'source_health', 'calculation_definitions',
    'source_identifiers', 'cvd_methodology',
    'PACKET_VERSION', 'PACKET_TIMESTAMP_UTC', 'PACKET_GENERATED_AT_UTC',
    'ANALYSIS_STATUS', 'ANALYSIS_AGENT'];
  for (const [key, val] of Object.entries(obj)) {
    if (skip.includes(key) || key.startsWith('_')) continue;
    findMetricObjects(val, path ? path + '.' + key : key, results, visited, skipKeys);
  }
}

// ─── Dynamic Data Quality (traverses actual JSON) ───
function computeDataQuality(packetJson) {
  const metrics = [];
  findMetricObjects(packetJson, '', metrics, new Set());

  let populated = 0, valueMissing = 0, valPresentTsMissing = 0;
  let fresh = 0, delayed = 0, stale = 0, unavailable = 0;
  let reproducible = 0, nonReproducible = 0;

  for (const { path, obj } of metrics) {
    if (obj.value == null) {
      valueMissing++;
      unavailable++;
      // null values are non-reproducible
      if (obj.data_type === 'derived') nonReproducible++;
    } else {
      populated++;
      if (!obj.source_observed_at_utc) valPresentTsMissing++;
      if (obj.freshness === 'fresh') fresh++;
      else if (obj.freshness === 'delayed') delayed++;
      else if (obj.freshness === 'stale') stale++;
      else unavailable++;

      // Reproducibility: derived metrics are reproducible if they have formula + dependencies
      if (obj.data_type === 'derived') {
        if (obj.formula && obj.dependencies && obj.dependencies.length > 0 &&
            !obj._derivation_gap) {
          reproducible++;
        } else {
          nonReproducible++;
        }
      }
    }
  }

  return {
    expected_metrics: metrics.length,
    populated_metrics: populated,
    value_missing: valueMissing,
    value_present_timestamp_missing: valPresentTsMissing,
    fresh_metrics: fresh,
    delayed_metrics: delayed,
    stale_metrics: stale,
    unavailable_metrics: unavailable,
    timestamp_validity_percent: populated > 0 ? Math.round((populated - valPresentTsMissing) / populated * 100) : 0,
    reproducible_derived_metrics_count: reproducible,
    non_reproducible_derived_metrics_count: nonReproducible,
    source_partial_count: 0,  // populated after source health
    source_unavailable_count: 0,
    source_error_count: 0
  };
}

// ─── Structured Source Health (OK/PARTIAL/UNAVAILABLE/ERROR) ───
function computeSourceHealth(packetJson) {
  const metrics = [];
  findMetricObjects(packetJson, '', metrics, new Set());

  const bySource = {};
  for (const { path, obj } of metrics) {
    const src = obj.source || 'unknown';
    const srcId = obj.source_identifier || src.toLowerCase();
    if (!bySource[src]) {
      bySource[src] = {
        transport_status: 'OK',
        auditability_status: 'OK',
        age_seconds: null,
        successful_metrics: [],
        affected_metrics: [],
        non_auditable_metrics: [],
        source_identifier_ref: srcId
      };
    }

    const age = obj.age_seconds;
    if (age != null && (bySource[src].age_seconds == null || age > bySource[src].age_seconds))
      bySource[src].age_seconds = age;

    if (obj.value == null || obj.freshness === 'unavailable' || !obj.eligible_for_analysis) {
      bySource[src].affected_metrics.push(path);
      bySource[src].auditability_status = 'PARTIAL';
    } else {
      bySource[src].successful_metrics.push(path);
      // Check for derivation gaps — non-auditable even if transport is OK
      if (obj._derivation_gap) {
        bySource[src].non_auditable_metrics.push(path);
        bySource[src].auditability_status = 'PARTIAL';
      }
    }

    // ERROR state: if ALL metrics in a source are affected
    if (obj.freshness === 'stale' && obj.eligible_for_analysis === false) {
      if (!bySource[src].affected_metrics.includes(path))
        bySource[src].affected_metrics.push(path);
    }
  }

  // Finalize transport_status and auditability_status
  for (const [src, info] of Object.entries(bySource)) {
    // Transport: no successful metrics at all → UNAVAILABLE
    if (info.successful_metrics.length === 0) {
      info.transport_status = 'UNAVAILABLE';
    }
    // Auditability: non-auditable metrics present → PARTIAL
    if (info.non_auditable_metrics.length === 0 && info.affected_metrics.length === 0) {
      info.auditability_status = 'OK';
    }
    // Clean up internal tracking arrays (not needed in output)
    // Keep in output for transparency
  }

  return bySource;
}

          _derivation_gap: 'candle count, price bins, and allocation method not available'
        }),
        value_area_width_percent: m(vpDiff != null && vp.poc != null ? (vpDiff / vp.poc * 100) : null, 'percent', 'vp', 'Binance', null, null, 'derived', 'value_area_width_pct', ['market_structure.volume_profile.poc','market_structure.volume_profile.vah','market_structure.volume_profile.val'])
      } : {
        status: "INVALID_METADATA",
        eligible_for_analysis: false,
        reason: [
          "value_area_too_narrow",
          "candle_count_missing",
          "price_bins_missing",
          "allocation_method_missing"
        ],
        reported_values: {
          poc: vp.poc || null,
          vah: vp.vah || null,
          val: vp.val || null,
          _note: "Reported values unverified — candle count, bins, and calculation method are not available. POC=VAH and $1 value area width are not physically meaningful."
        }
      }
    },

    macro: {
      broad_trade_weighted_usd: m(ctx.dxy, null, 'fred', 'FRED', 'DTWEXBGS (Trade Weighted U.S. Dollar Index: Broad, Goods and Services)', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable — FRED publishes daily; pipeline does not capture publication date'
      }),
      us10y: m(ctx.us10y, 'percent', 'fred', 'FRED', 'DGS10 (10-Year Treasury)', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable'
      }),
      vix: m(ctx.vix || enr.vix, null, 'yahoo', 'Yahoo Finance', '^VIX', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable — Yahoo Finance API does not expose per-observation timestamp'
      }),
      equities: m(ctx.equities, null, 'yahoo', 'Yahoo Finance', 'SPY/QQQ/GLD basket', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable; basket composition not provided'
      }),
      usdjpy: m(ctx.usdjpy, null, 'yahoo', 'Yahoo Finance', 'USDJPY=X', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable'
      }),
      mstr: m(ctx.mstr_close, 'USD', 'yahoo', 'Yahoo Finance', 'MSTR', null, 'raw', null, null, {
        _derivation_gap: 'source observation timestamp unavailable'
      }),
      btc_equity_correlation: m(enr.correlation_r || ctx.correlation_r, 'Pearson r', 'pipeline', 'Pipeline', null, '30d', 'derived', 'btc_equity_correlation', null, {
        _derivation_gap: 'correlation inputs (30 daily BTC + equity returns) not available in source data'
      }),
      etf_flows: {
        daily: m(ctx.etf_flow_daily, 'M USD', 'etf', 'ETF aggregate', null, '1d', 'raw', null, null, {
          _derivation_gap: 'trading date not provided by source; source observation timestamp unavailable'
        }),
        daily_as_of_trading_date: null,
        daily_date_status: "SOURCE_DATE_UNAVAILABLE",
        weekly: m(ctx.etf_flow_weekly, 'M USD', 'etf', 'ETF aggregate', null, '7d', 'raw', null, null, {
          _derivation_gap: 'trading date not provided by source'
        }),
        weekly_as_of_trading_date: null,
        weekly_date_status: "SOURCE_DATE_UNAVAILABLE",
        _note: "ETF flow data source does not provide the trading date represented by each value. Packet date is NOT the trading date."
      },
      sentiment: {
        fear_greed: m(enr.fng_value || ctx.fng_value, null, 'alternative', 'Alternative.me', 'BTC Fear & Greed Index'),
        black_swan: m(enr.black_swan_score != null ? enr.black_swan_score + '/' + enr.black_swan_max : null, null, 'pipeline', 'Pipeline', null, null, 'derived', null, null, {
          _derivation_gap: 'black swan scoring inputs (stress indicators, event triggers) not available in source data'
        })
      }
    },

    on_chain: {
      mvrv: m(brk.mvrv, null, 'onchain', 'Glassnode', 'BTC', null, 'raw'),
      mvrv_z: m(cyc.mvrv_z ? Number(cyc.mvrv_z) : null, null, 'onchain', 'Glassnode', 'BTC', null, 'raw'),
      nupl: m(nupl, 'fraction', 'onchain', 'Glassnode', 'BTC', null, 'derived', 'nupl', ['on_chain.mvrv']),
      sopr: m(brk.sopr_24h ? Number(brk.sopr_24h) : null, null, 'onchain', 'Glassnode', 'BTC', '24h', 'raw'),
      lth_sopr: m(brk.lth_sopr_24h ? Number(brk.lth_sopr_24h) : null, null, 'onchain', 'Glassnode', 'BTC', '24h', 'raw'),
      sth_sopr: m(brk.sth_sopr_24h ? Number(brk.sth_sopr_24h) : null, null, 'onchain', 'Glassnode', 'BTC', '24h', 'raw'),
      realized_price: m(brk.realized_price, 'USD', 'onchain', 'Glassnode', 'BTC'),
      netflow_7d: m(cyc.netflow_7d ? Number(cyc.netflow_7d) : null, 'BTC', 'onchain', 'Glassnode', 'BTC', '7d', 'raw'),
      supply_in_profit_pct: m(brk.supply_in_profit_share, 'percent', 'onchain', 'Glassnode', 'BTC')
    }
  };

  // Compute dynamic data quality and source health
  const dq = computeDataQuality(packet);
  const sh = computeSourceHealth(packet);

  // Update source counts from source health
  let partialCount = 0, unavailableCount = 0, errorCount = 0;
  for (const [src, info] of Object.entries(sh)) {
    if (info.transport_status === 'OK' && info.non_auditable_metrics && info.non_auditable_metrics.length > 0) partialCount++;
    if (info.transport_status === 'PARTIAL') partialCount++;
    if (info.transport_status === 'UNAVAILABLE') unavailableCount++;
    if (info.transport_status === 'ERROR') errorCount++;
  }
  dq.source_partial_count = partialCount;
  dq.source_unavailable_count = unavailableCount;
  dq.source_error_count = errorCount;

  // Inject post-hoc
  packet.data_quality = dq;
  packet.source_health = sh;
  packet.ANALYSIS_STATUS = "NOT_PERFORMED";
  packet.ANALYSIS_AGENT = "ChatGPT";

  return packet;
}

// ─── Copy ───
async function copyJsonToClipboard() {
  if (!currentData) return;
  const srcTs = extractSourceTimestamps(currentData);
  const packet = buildStructuredJson(currentData, srcTs);
  const json = JSON.stringify(packet, null, 2);
  const btn = document.getElementById('copy-json-btn');
  try {
    await navigator.clipboard.writeText(json);
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy JSON'; btn.classList.remove('copied'); }, 2000);
  } catch (e) {
    const ta = document.createElement('textarea'); ta.value = json;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy JSON'; btn.classList.remove('copied'); }, 2000);
  }
}

// ─── Load ───
async function loadAll() {
  let data = null;
  for (const path of DATA_PATHS) {
    try { const res = await fetch(path + '?t=' + Date.now()); if (res.ok) { data = await res.json(); break; } } catch (e) { continue; }
  }
  if (!data) { document.getElementById('dq-stats').textContent = 'DATA LOAD FAILED'; return; }
  currentData = data;

  const srcTs = extractSourceTimestamps(data);
  buildBrief(data, srcTs);

  const packet = buildStructuredJson(data, srcTs);
  const json = JSON.stringify(packet, null, 2);
  document.getElementById('json-block').textContent = json;

  // Data quality banner from dynamic traversal
  const dq = packet.data_quality;
  document.getElementById('dq-stats').textContent =
    dq.expected_metrics + ' metrics · ' +
    dq.populated_metrics + ' populated · ' +
    dq.value_missing + ' missing · ' +
    dq.fresh_metrics + ' fresh · ' +
    dq.stale_metrics + ' stale · ' +
    dq.unavailable_metrics + ' unavail · ' +
    'ts valid ' + dq.timestamp_validity_percent + '% · ' +
    'reproducible ' + dq.reproducible_derived_metrics_count + ' · ' +
    'partial src ' + dq.source_partial_count + ' · ' +
    'partial src ' + dq.source_partial_count + ' · ' +
    'unavail src ' + dq.source_unavailable_count + ' · ' +
    'error src ' + dq.source_error_count;

  // Hero freshness
  const ts = data.header.generated_timestamp;
  const age = ageSec(ts);
  const fcls = age != null ? (age < 450 ? 'fresh' : age < 1800 ? 'delayed' : 'stale') : 'unavailable';
  document.getElementById('freshness-dot').className = 'freshness-dot ' + fcls;
  document.getElementById('freshness-label').textContent = {fresh:'Fresh',delayed:'Delayed',stale:'Stale',unavailable:'Unavailable'}[fcls];
  document.getElementById('packet-age').textContent = age != null ? age + 's ago' : '—';

  countdown = 60;
  updateCountdown();
}

function updateCountdown() { document.getElementById('countdown').textContent = countdown; }

document.addEventListener('DOMContentLoaded', () => {
  loadAll();
  setInterval(() => { countdown--; if (countdown <= 0) { loadAll(); countdown = 60; } updateCountdown(); }, 1000);
});
</script>

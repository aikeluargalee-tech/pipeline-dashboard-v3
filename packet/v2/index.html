<script>
// ═══════════════════════════════════════════════════════════════
// BTC_DATA_PACKET_V2 — Data Integrity Engine
// ═══════════════════════════════════════════════════════════════

const DATA_PATHS = ['../data.json','/pipeline-dashboard-v3/packet/data.json'];
const COMPASS_PATH = '../regime-compass-data.json';
let currentData = null, compassData = null, countdown = 60;

// ─── UTC helpers ───
function nowUtc() { return new Date().toISOString(); }
function ageSec(ts) { if (!ts) return null; return Math.round((Date.now() - new Date(ts).getTime()) / 1000); }
function isoOk(ts) { return ts && !ts.includes('|') && !ts.includes('=') && ts.match(/^\d{4}-\d{2}-\d{2}T/); }

// ─── Source timestamp extraction ───
// Returns { observed_at_utc, collected_at_utc, frequency_sec } per subsystem
function extractSourceTimestamps(d) {
  const st = (d.status && d.status.source_timestamps) || {};
  const h = d.header || {};
  const packetTs = h.generated_timestamp || nowUtc();
  const out = {};

  // AMT — real-time, same as packet
  out.amt = {
    observed_at_utc: st.amt || packetTs,
    collected_at_utc: packetTs,
    frequency_sec: 900
  };

  // VP — from source timestamp
  out.vp = {
    observed_at_utc: st.vp || null,
    collected_at_utc: packetTs,
    frequency_sec: 3600
  };

  // Pipeline (regime, macro, derivs, cycle) — from combined text
  const pipeRaw = st.pipeline || '';
  out.pipeline = {
    observed_at_utc: pipeRaw.replace(/^.*regime=([^\s|]+).*$/, '$1').replace(' UTC','') || null,
    collected_at_utc: packetTs,
    frequency_sec: 3600
  };

  // On-chain (brk/fetched_at)
  const brk = (d.reference && d.reference.brk) || {};
  out.onchain = {
    observed_at_utc: brk.fetched_at || pipeRaw.replace(/^.*regime=([^\s|]+).*$/, '$1') || null,
    collected_at_utc: packetTs,
    frequency_sec: 86400
  };

  // AI Factors
  const ai = d.ai_factors || {};
  out.aifactors = {
    observed_at_utc: ai.last_updated || null,
    collected_at_utc: packetTs,
    frequency_sec: 1800
  };

  // Regime
  const reg = d.regime || {};
  out.regime = {
    observed_at_utc: reg.as_of || null,
    collected_at_utc: packetTs,
    frequency_sec: 3600
  };

  return out;
}

// ─── Build timestamp metadata block per metric ───
function tsMeta(srcKey, d, srcTs, overrideObserved) {
  const h = d.header || {};
  const packetTs = h.generated_timestamp || nowUtc();
  const src = (srcTs && srcTs[srcKey]) || {};
  const observed = overrideObserved || src.observed_at_utc || packetTs;
  const collected = src.collected_at_utc || packetTs;
  const age = ageSec(observed);
  const freq = src.frequency_sec || 900;
  const fclass = !observed ? 'unavailable' : age < freq * 0.5 ? 'fresh' : age < freq * 2 ? 'delayed' : age < freq * 6 ? 'stale' : 'unavailable';

  return {
    observed_at_utc: isoOk(observed) ? observed : null,
    collected_at_utc: isoOk(collected) ? collected : packetTs,
    packet_generated_at_utc: packetTs,
    source_update_frequency_seconds: freq,
    age_seconds: age,
    freshness: fclass
  };
}

// ─── Metric with proper timestamps ───
function metric(label, value, unit, source, srcKey, d, srcTs, dataType, note) {
  const meta = tsMeta(srcKey, d, srcTs);
  const fcls = meta.freshness;
  const suffix = note ? ` <span class="tag tag-${fcls === 'stale' ? 'stale' : fcls === 'unavailable' ? 'unavailable' : 'raw'}">${note}</span>` : '';
  const valCls = typeof value === 'number' ? (value > 0 ? 'positive' : value < 0 ? 'negative' : 'neutral') : '';
  let disp = value != null ? value : '—';
  if (typeof value === 'number') {
    if (Math.abs(value) < 0.01 && value !== 0) disp = value.toExponential(2);
    else if (Math.abs(value) < 1) disp = value.toFixed(4);
    else if (Math.abs(value) < 100) disp = value.toFixed(3);
    else disp = value.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (value > 0 && unit !== '%') disp = '+' + disp;
  }
  if (value == null) disp = '—';
  const srcTag = source ? ` <span style="font-size:0.7em;color:var(--muted)">[${source}]</span>` : '';
  const staleTag = fcls === 'stale' ? ' <span class="tag tag-stale">STALE</span>' : '';
  const unavTag = fcls === 'unavailable' && value == null ? ' <span class="tag tag-unavailable">UNAVAIL</span>' : '';
  return `<div class="metric-row"><span class="metric-label">${label}${srcTag}${staleTag}${unavTag}</span><span class="metric-value ${valCls}">${disp}${unit ? ' ' + unit : ''}${suffix}</span></div>`;
}

// ─── Build Telemetry Brief ───
function buildBrief(d, srcTs) {
  const h = d.header || {}, c = d.critical || {}, ctx = d.context || {};
  const ref = d.reference || {}, enr = d.enriched || {}, ai = d.ai_factors || {};
  const reg = d.regime || {}, src = d.sources || {}, status = d.status || {};
  const brk = ref.brk || {}, cyc = ref.cycle || {};

  // Core Price
  let html = '<h2>💰 Core Price</h2>';
  html += metric('BTC/USDT Spot', h.btc_price, 'USD', 'Binance', 'amt', d, srcTs, 'raw');
  html += metric('24h Change', h.change_24h, '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('Bid', h.bid, 'USD', 'Binance', 'amt', d, srcTs, 'raw');
  html += metric('Ask', h.ask, 'USD', 'Binance', 'amt', d, srcTs, 'raw');
  html += metric('Spread', h.spread, 'USD', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('24h Volume', h.volume_24h, 'USD', 'Binance', 'amt', d, srcTs, 'raw');
  document.getElementById('core-price').innerHTML = html;

  // Derivatives
  html = '<h2>📐 Derivatives</h2>';
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Funding</h3>';
  html += metric('Funding Rate', ctx.funding_rate, '%', 'Binance', 'amt', d, srcTs, 'raw', enr.funding_signal);
  html += metric('Annualized', ctx.funding_rate ? (ctx.funding_rate * 100 * 365 * 3).toFixed(3) + '%' : null, null, 'Binance', 'amt', d, srcTs, 'derived');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Open Interest</h3>';
  html += metric('OI (USD)', c.oi_absolute_usd_billions, 'B USD', 'Binance', 'amt', d, srcTs, 'raw');
  html += metric('OI Δ 1h', (c.oi_per_tf_pct_change || {})['1H'], '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('OI Δ 4h', (c.oi_per_tf_pct_change || {})['4H'], '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('OI Δ 24h', enr.oi_change_24h_pct || ctx.oi_change_24h, '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('OI Trend', enr.oi_trend || enr.oi_delta, null, 'Binance', 'amt', d, srcTs, 'inferred');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Futures Basis</h3>';
  html += metric('Perp Basis', ctx.perp_basis_pct, '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Taker Data</h3>';
  const takerRatio = enr.taker_buy_ratio;
  const takerShare = takerRatio != null ? takerRatio / (1 + takerRatio) : null;
  html += metric('Taker Buy Share', takerShare, 'fraction', 'Binance', 'amt', d, srcTs, 'derived', 'buy/(buy+sell)');
  html += metric('Taker Buy/Sell Ratio', takerRatio, null, 'Binance', 'amt', d, srcTs, 'derived', 'buy/sell');
  document.getElementById('derivatives').innerHTML = html;

  // Spot vs Futures (annotated honestly — CVD is composite from AMT)
  html = '<h2>⚔️ Spot vs Futures</h2>';
  html += '<div style="font-size:0.72em;color:var(--stale);margin-bottom:12px">⚠️ CVD data from AMT feed does not separate spot from perpetual. Metrics below are composite (aggregated). True spot/perp separation requires pipeline upgrade.</div>';
  html += metric('CVD 1h (composite)', (c.cvd_per_tf || {})['1H'], 'USD', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('CVD 4h (composite)', (c.cvd_per_tf || {})['4H'], 'USD', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('CVD 24h (composite)', ctx.cvd_24h, 'USD', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('Coinbase Premium', ctx.coinbase_premium, '%', 'Coinbase', 'amt', d, srcTs, 'raw');
  html += metric('Delta Trend', c.delta_trend, null, 'Binance', 'amt', d, srcTs, 'inferred');
  html += metric('Session CVD', c.session_cvd, 'USD', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('L/S Ratio', ctx.long_short_ratio, null, 'Binance', 'amt', d, srcTs, 'raw');
  document.getElementById('spot-vs-futures').innerHTML = html;

  // Liquidations
  html = '<h2>💥 Liquidations</h2>';
  if (ctx.liq_clusters) {
    html += metric('Liq Clusters', ctx.liq_clusters, null, 'Coinglass', 'amt', d, srcTs, 'raw');
  } else {
    html += '<div class="metric-row"><span class="metric-label">Observed Liquidations</span><span class="metric-value"><span class="tag tag-unavailable">UNAVAILABLE</span></span></div>';
    html += '<div class="metric-row"><span class="metric-label">Heatmap Clusters</span><span class="metric-value"><span class="tag tag-unavailable">UNAVAILABLE</span></span></div>';
  }
  document.getElementById('liquidations').innerHTML = html;

  // Market Structure
  html = '<h2>📊 Market Structure & Volume Profile</h2>';
  const vp = src.volume_profile || {}, amt = src.amt || {};
  html += metric('ADX', amt.adx, null, 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('ADX Regime', amt.adx_regime, null, 'Binance', 'amt', d, srcTs, 'inferred');
  html += metric('Balance State', amt.balance_state || c.balance_state, null, 'Binance', 'amt', d, srcTs, 'inferred');
  html += metric('Balance Width', c.balance_width_pct, '%', 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('Daily RSI (14)', ctx.daily_rsi_14, null, 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('S/R 1h', ref.sr_1h, null, 'Binance', 'amt', d, srcTs, 'derived');
  html += metric('S/R 1d', ref.sr_1d, null, 'Binance', 'amt', d, srcTs, 'derived');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Volume Profile</h3>';
  html += metric('POC', vp.poc, 'USD', 'Binance', 'vp', d, srcTs, 'derived');
  html += metric('VAH', vp.vah, 'USD', 'Binance', 'vp', d, srcTs, 'derived');
  html += metric('VAL', vp.val, 'USD', 'Binance', 'vp', d, srcTs, 'derived');
  const vpWidth = vp.vah && vp.val && vp.poc ? ((vp.vah - vp.val) / vp.poc * 100).toFixed(3) : null;
  html += metric('Value Area Width', vpWidth, '%', 'Binance', 'vp', d, srcTs, 'derived');
  html += metric('VP State', vp.state, null, 'Binance', 'vp', d, srcTs, 'inferred');
  html += metric('VP Direction', vp.direction, null, 'Binance', 'vp', d, srcTs, 'inferred');
  // Flag suspicious narrow VA
  const atr = enr.atr_1h_pct || enr.atr_1d_pct || 0;
  if (vpWidth != null && vpWidth < atr * 0.5) {
    html += '<div class="metric-row"><span class="metric-label" style="color:var(--yellow)">⚠️ VP Warning</span><span class="metric-value warning">Value area suspiciously narrow vs ATR (' + atr.toFixed(2) + '%)</span></div>';
  }
  document.getElementById('market-structure').innerHTML = html;

  // Macro
  html = '<h2>🌐 Macro & Capital Flows</h2>';
  html += metric('DXY', ctx.dxy, null, 'FRED', 'amt', d, srcTs, 'raw');
  html += metric('US 10Y Yield', ctx.us10y, '%', 'FRED', 'amt', d, srcTs, 'raw');
  html += metric('VIX', ctx.vix || enr.vix, null, 'Yahoo Finance', 'amt', d, srcTs, 'raw');
  html += metric('Equities', ctx.equities, null, 'Yahoo Finance', 'amt', d, srcTs, 'raw');
  html += metric('USD/JPY', ctx.usdjpy, null, 'Yahoo Finance', 'amt', d, srcTs, 'raw');
  html += metric('MSTR', ctx.mstr_close, 'USD', 'Yahoo Finance', 'amt', d, srcTs, 'raw');
  html += metric('BTC-Equity Corr', enr.correlation_r || ctx.correlation_r, 'r (30d)', 'Pipeline', 'pipeline', d, srcTs, 'derived');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">ETF Flows</h3>';
  html += metric('ETF Flow (daily)', ctx.etf_flow_daily, 'M USD', 'ETF aggregate', 'amt', d, srcTs, 'raw');
  html += metric('ETF Flow (weekly)', ctx.etf_flow_weekly, 'M USD', 'ETF aggregate', 'amt', d, srcTs, 'raw');
  html += '<h3 style="font-size:0.85em;color:var(--muted);margin:12px 0 8px">Sentiment</h3>';
  html += metric('Fear & Greed', enr.fng_value || ctx.fng_value, null, 'Alternative.me', 'amt', d, srcTs, 'raw', enr.fng_classification);
  html += metric('Black Swan', enr.black_swan_score + '/' + enr.black_swan_max, null, 'Pipeline', 'pipeline', d, srcTs, 'inferred', enr.black_swan_status);
  document.getElementById('macro-flows').innerHTML = html;

  // On-Chain
  html = '<h2>⛓️ On-Chain</h2>';
  const mvrv = brk.mvrv, nupl = mvrv ? (1 - 1/mvrv) : null;
  html += metric('MVRV', mvrv ? mvrv.toFixed(3) : null, null, 'Glassnode', 'onchain', d, srcTs, 'derived');
  html += metric('MVRV Z-Score', cyc.mvrv_z ? Number(cyc.mvrv_z).toFixed(4) : null, null, 'Glassnode', 'onchain', d, srcTs, 'derived');
  html += metric('NUPL', nupl != null ? (nupl*100).toFixed(1)+'%' : null, null, 'Glassnode', 'onchain', d, srcTs, 'derived');
  html += metric('SOPR', brk.sopr_24h ? Number(brk.sopr_24h).toFixed(4) : null, null, 'Glassnode', 'onchain', d, srcTs, 'raw');

  document.getElementById('onchain').innerHTML = html;

  // Composite Scores
  html = '<h2>🧠 Composite Scores</h2>';
  const ai9 = ai.s9_vix_roc || {}, ai10 = ai.s10_us10y_roc || {}, ai11 = ai.s11_volume_anomaly || {};
  const l05 = ai.layer0_5 || {}, tw = ai.tripwire_summary || {};
  html += metric('S9 VIX RoC', ai9.score != null ? ai9.score : null, null, 'AI Factors', 'aifactors', d, srcTs, 'inferred', ai9.label);
  html += metric('S10 US10Y RoC', ai10.score != null ? ai10.score : null, null, 'AI Factors', 'aifactors', d, srcTs, 'inferred', ai10.label);
  html += metric('S11 Vol Anomaly', ai11.score != null ? ai11.score : null, null, 'AI Factors', 'aifactors', d, srcTs, 'inferred', ai11.label);
  html += metric('Forced Sell Risk', l05.forced_sell_risk || null, null, 'AI Factors L0.5', 'aifactors', d, srcTs, 'inferred');
  html += metric('Active Tripwires', tw.active_count + '/' + tw.total, null, 'AI Factors', 'aifactors', d, srcTs, 'inferred');
  html += metric('Regime', reg.label || null, null, 'Pipeline', 'regime', d, srcTs, 'inferred', reg.confidence ? (reg.confidence*100).toFixed(0)+'% conf' : null);
  html += metric('Trap Monitor', (src.trap_monitor || {}).score || null, '/7', 'Pipeline', 'pipeline', d, srcTs, 'inferred', (src.trap_monitor||{}).status);
  document.getElementById('composite-scores').innerHTML = html;
}

// ─── P2: Multi-dimensional completeness ───
function computeCompleteness(d, srcTs) {
  const h = d.header || {}, c = d.critical || {}, ctx = d.context || {};
  const enr = d.enriched || {}, reg = d.regime || {}, src = d.sources || {};
  const brk = (d.reference && d.reference.brk) || {};
  const ai = d.ai_factors || {};
  const packetTs = h.generated_timestamp;

  // Define critical metrics with their source keys
  const critical = [
    { key: 'amt', label: 'Price', ok: !!h.btc_price },
    { key: 'amt', label: '24h Change', ok: h.change_24h != null },
    { key: 'amt', label: 'Spread', ok: h.spread != null },
    { key: 'amt', label: 'OI USD', ok: !!c.oi_absolute_usd_billions },
    { key: 'amt', label: 'Funding', ok: ctx.funding_rate != null },
    { key: 'amt', label: 'DXY', ok: !!ctx.dxy },
    { key: 'amt', label: 'US10Y', ok: !!ctx.us10y },
    { key: 'amt', label: 'VIX', ok: !!(ctx.vix || enr.vix) },
    { key: 'amt', label: 'CVD', ok: ctx.cvd_24h != null },
    { key: 'amt', label: 'Coinbase Prem', ok: ctx.coinbase_premium != null },
    { key: 'amt', label: 'L/S Ratio', ok: !!ctx.long_short_ratio },
    { key: 'amt', label: 'Taker', ok: enr.taker_buy_ratio != null },
    { key: 'amt', label: 'F&G', ok: !!(enr.fng_value || ctx.fng_value) },
    { key: 'amt', label: 'ETF Flow', ok: ctx.etf_flow_daily != null },
    { key: 'onchain', label: 'MVRV', ok: !!brk.mvrv },
    { key: 'onchain', label: 'SOPR', ok: brk.sopr_24h != null },
    { key: 'onchain', label: 'Realized Price', ok: !!brk.realized_price },
    { key: 'vp', label: 'POC', ok: !!(src.volume_profile && src.volume_profile.poc) },
    { key: 'amt', label: 'ADX', ok: !!(src.amt && src.amt.adx) },
    { key: 'pipeline', label: 'Regime', ok: !!reg.label },
    { key: 'pipeline', label: 'Trap Monitor', ok: !!(src.trap_monitor && src.trap_monitor.score) },
    { key: 'aifactors', label: 'AI Factors', ok: !!(ai.s9_vix_roc) },
    { key: 'pipeline', label: 'Black Swan', ok: enr.black_swan_score != null },
    { key: 'amt', label: 'Delta Trend', ok: !!c.delta_trend },
    { key: 'amt', label: 'S/R Bands', ok: !!(d.reference && (d.reference.sr_1h || d.reference.sr_1d)) },
  ];

  const total = critical.length;
  let available = 0, fresh = 0, hasSource = 0, hasType = 0;

  for (const m of critical) {
    if (m.ok) {
      available++;
      // Freshness: check source timestamp age vs expected frequency
      const s = (srcTs && srcTs[m.key]) || {};
      const freq = s.frequency_sec || 900;
      const age = ageSec(s.observed_at_utc || packetTs);
      if (age != null && age < freq * 2) fresh++;
      // Source integrity: does the source key exist?
      if (srcTs && srcTs[m.key] && srcTs[m.key].observed_at_utc) hasSource++;
      // Metadata: does it have a source label?
      hasType++; // all critical metrics have source labels in buildStructuredJson
    }
  }

  const availPct = Math.round((available / total) * 100);
  const freshPct = available > 0 ? Math.round((fresh / available) * 100) : 0;
  const metaPct = available > 0 ? Math.round((hasType / available) * 100) : 0;
  const sourcePct = available > 0 ? Math.round((hasSource / available) * 100) : 0;
  // Critical readiness: all 5 dimensions must be strong
  const criticalPct = Math.round((availPct * 0.4 + freshPct * 0.3 + sourcePct * 0.2 + metaPct * 0.1));

  return {
    availability_percent: availPct,
    freshness_percent: freshPct,
    metadata_percent: metaPct,
    source_integrity_percent: sourcePct,
    critical_decision_readiness_percent: criticalPct,
    total_expected: total,
    total_available: available
  };
}

// ─── P7: Verdict with reason codes ───
function buildVerdict(d, srcTs) {
  const c = d.critical || {}, ctx = d.context || {}, enr = d.enriched || {};
  const amt = (d.sources || {}).amt || {}, trap = (d.sources || {}).trap_monitor || {};
  const vp = (d.sources || {}).volume_profile || {}, h = d.header || {};
  const comp = computeCompleteness(d, srcTs);

  // Gather excluded (stale/unavailable) inputs
  const excluded = [];
  const packetTs = h.generated_timestamp;
  const staleness = d.status && d.status.staleness_warnings || [];

  // Check freshness of key subsystems
  const amtAge = ageSec((srcTs && srcTs.amt && srcTs.amt.observed_at_utc) || packetTs);
  const vpAge = ageSec((srcTs && srcTs.vp && srcTs.vp.observed_at_utc) || packetTs);
  const pipeAge = ageSec((srcTs && srcTs.pipeline && srcTs.pipeline.observed_at_utc) || packetTs);

  if (amtAge > 1800) excluded.push('AMT data stale (' + Math.round(amtAge/60) + 'm)');
  if (vpAge > 7200) excluded.push('VP data stale (' + Math.round(vpAge/60) + 'm)');
  if (pipeAge > 7200) excluded.push('Pipeline data stale (' + Math.round(pipeAge/60) + 'm)');

  // Determine action
  let action = 'WAIT', reasonCode = 'WAIT', confidence = 0.5, dominantTf = '1h';
  const pros = [], cons = [];
  const included = [], excludedFull = [...excluded];

  // Data integrity gates
  if (comp.critical_decision_readiness_percent < 70) {
    action = 'NO_TRADE_DATA_STALE';
    reasonCode = 'NO_TRADE_DATA_STALE';
    confidence = 0.1;
    cons.push('Critical readiness ' + comp.critical_decision_readiness_percent + '% < 70% threshold');
    excludedFull.push('Critical data incomplete: ' + (comp.total_expected - comp.total_available) + ' metrics missing');
  } else if (comp.freshness_percent < 50) {
    action = 'NO_TRADE_DATA_STALE';
    reasonCode = 'NO_TRADE_DATA_STALE';
    confidence = 0.15;
    cons.push('Freshness ' + comp.freshness_percent + '% — stale data cannot support decisions');
  }
  // Trap gates
  else if (trap.score && parseInt(trap.score) >= 3 && trap.direction) {
    action = 'NO_TRADE_LEVERAGE_TRAP';
    reasonCode = 'NO_TRADE_LEVERAGE_TRAP';
    confidence = 0.2;
    cons.push('Trap monitor: ' + trap.score + ' active — ' + trap.direction);
    pros.push('Aware of trap = not walking into it');
  }
  // Macro risk gate
  else if ((enr.fng_value || ctx.fng_value || 50) < 20 && (enr.black_swan_score || 0) > 3) {
    action = 'NO_TRADE_MACRO_RISK';
    reasonCode = 'NO_TRADE_MACRO_RISK';
    confidence = 0.25;
    cons.push('Fear (' + (enr.fng_value || ctx.fng_value) + ') + Black Swan signals (' + (enr.black_swan_score || 0) + '/' + (enr.black_swan_max || 17) + ')');
  }
  // Insufficient data
  else if (comp.availability_percent < 70) {
    action = 'INSUFFICIENT_DATA';
    reasonCode = 'INSUFFICIENT_DATA';
    confidence = 0.15;
    cons.push('Availability ' + comp.availability_percent + '% — ' + (comp.total_expected - comp.total_available) + ' critical inputs missing');
  }
  // Directional setups
  else if (amt.adx_regime === 'TRENDING' && amt.adx > 30) {
    dominantTf = '4h';
    if (vp.direction === 'LONG') {
      action = 'LONG_SETUP'; reasonCode = 'LONG_SETUP'; confidence = 0.55;
      pros.push('ADX trending (' + amt.adx + ')'); pros.push('VP bias LONG'); pros.push('OI ' + (enr.oi_trend || 'stable'));
    } else if (vp.direction === 'SHORT') {
      action = 'SHORT_SETUP'; reasonCode = 'SHORT_SETUP'; confidence = 0.55;
      pros.push('ADX trending (' + amt.adx + ')'); pros.push('VP bias SHORT'); pros.push('OI ' + (enr.oi_trend || 'stable'));
    } else {
      action = 'WATCH_FOR_LONG'; reasonCode = 'WATCH_FOR_LONG'; confidence = 0.4;
      pros.push('ADX trending (' + amt.adx + ') — awaiting directional bias');
    }
  } else if (c.balance_state === 'TIGHT_BALANCE') {
    action = 'WAIT'; reasonCode = 'WAIT'; confidence = 0.35;
    pros.push('Tight balance — breakout imminent'); cons.push('No directional trigger yet');
  }

  // Additional evidence
  if (enr.fng_value <= 25) pros.push('Fear zone — contrarian potential');
  if (enr.fng_value >= 75) cons.push('Greed zone — caution');
  if (enr.correlation_r && enr.correlation_r < -0.5) pros.push('BTC decorrelated from equities');
  if (ctx.perp_basis_pct != null && ctx.perp_basis_pct < -0.3) cons.push('Backwardation — bearish futures');

  // Included inputs
  included.push('Price: $' + (h.btc_price || '?'));
  included.push('ADX: ' + (amt.adx || '?') + ' (' + (amt.adx_regime || '?') + ')');
  included.push('VP: ' + (vp.direction || '?'));
  included.push('Completeness: ' + comp.critical_decision_readiness_percent + '%');

  // Update DOM
  document.getElementById('verdict-action').textContent = action.replace(/_/g, ' ');
  document.getElementById('verdict-reason').textContent = 'Reason: ' + reasonCode + ' · Confidence: ' + (confidence*100).toFixed(0) + '% · Dominant TF: ' + dominantTf;

  // Completeness
  document.getElementById('completeness-fill').style.width = comp.critical_decision_readiness_percent + '%';
  document.getElementById('completeness-fill').style.background =
    comp.critical_decision_readiness_percent >= 70 ? 'var(--green)' :
    comp.critical_decision_readiness_percent >= 40 ? 'var(--yellow)' : 'var(--red)';
  document.getElementById('completeness-detail').innerHTML =
    '<span><span class="val">' + comp.availability_percent + '%</span>avail</span>' +
    '<span><span class="val">' + comp.freshness_percent + '%</span>fresh</span>' +
    '<span><span class="val">' + comp.metadata_percent + '%</span>meta</span>' +
    '<span><span class="val">' + comp.source_integrity_percent + '%</span>source</span>' +
    '<span><span class="val" style="color:' + (comp.critical_decision_readiness_percent >= 70 ? 'var(--green)' : 'var(--red)') + '">' + comp.critical_decision_readiness_percent + '%</span>readiness</span>';

  // Evidence grid
  document.getElementById('verdict-grid').innerHTML =
    '<div class="pro"><strong>✅ Supporting (' + pros.length + '):</strong><br>' + (pros.length ? pros.join('<br>') : '—') + '</div>' +
    '<div class="con"><strong>❌ Conflicting (' + cons.length + '):</strong><br>' + (cons.length ? cons.join('<br>') : '—') + '</div>' +
    '<div class="info"><strong>📋 Included (' + included.length + '):</strong><br>' + included.join('<br>') + '</div>' +
    '<div class="con"><strong>🚫 Excluded (' + excludedFull.length + '):</strong><br>' + (excludedFull.length ? excludedFull.join('<br>') : '— none —') + '</div>';

  return { action, reasonCode, confidence, dominantTf, included, excluded: excludedFull, supporting: pros, conflicting: cons, completeness: comp };
}

    },

    composite_scores: {
      _stale_policy: "Stale subsystems (age > 2x update frequency) are excluded. Unavailable subsystems contribute nothing.",
      s9_vix_roc: {

        missing_inputs: (ai.s9_vix_roc || {}).score != null ? [] : ["VIX RoC data"],
        excluded: ageSec((ai.s9_vix_roc || {}).as_of || ai.last_updated) > 3600 ? 'STALE' : null,
        ...tsMeta('aifactors', d, srcTs)
      },
      s10_us10y_roc: {
        value: (ai.s10_us10y_roc || {}).score != null ? (ai.s10_us10y_roc || {}).score : null,
        label: (ai.s10_us10y_roc || {}).label || null,
        inputs_available: (ai.s10_us10y_roc || {}).score != null ? 1 : 0,
        inputs_required: 1,
        missing_inputs: (ai.s10_us10y_roc || {}).score != null ? [] : ["US10Y RoC data"],
        excluded: ageSec((ai.s10_us10y_roc || {}).as_of || ai.last_updated) > 3600 ? 'STALE' : null,
        ...tsMeta('aifactors', d, srcTs)
      },
      s11_volume_anomaly: {
        value: (ai.s11_volume_anomaly || {}).score != null ? (ai.s11_volume_anomaly || {}).score : null,
        label: (ai.s11_volume_anomaly || {}).label || null,
        inputs_available: (ai.s11_volume_anomaly || {}).score != null ? 1 : 0,
        inputs_required: 1,
        missing_inputs: (ai.s11_volume_anomaly || {}).score != null ? [] : ["volume anomaly data"],
        excluded: ageSec((ai.s11_volume_anomaly || {}).as_of || ai.last_updated) > 3600 ? 'STALE' : null,
        ...tsMeta('aifactors', d, srcTs)
      },
      forced_sell_risk: {
        value: (ai.layer0_5 || {}).forced_sell_risk || null,
        excluded: ageSec((ai.layer0_5 || {}).as_of || ai.last_updated) > 3600 ? 'STALE' : null,
        ...tsMeta('aifactors', d, srcTs)
      },
      active_tripwires: {
        value: (ai.tripwire_summary || {}).active_count + '/' + (ai.tripwire_summary || {}).total
      },
      regime: {
        value: reg.label || null,
        confidence: reg.confidence || null,
        sub_regimes: reg.sub_regimes || null,
        excluded: ageSec(reg.as_of) > 7200 ? 'STALE' : null,
        ...tsMeta('regime', d, srcTs)
      },
      trap_monitor: {
        value: (src.trap_monitor || {}).score || null,
        max: "7",
        status: (src.trap_monitor || {}).status || null,
        direction: (src.trap_monitor || {}).direction || null,
        active_traps: (src.trap_monitor || {}).active_traps || [],
        excluded: ageSec((src.trap_monitor || {}).collected) > 7200 ? 'STALE' : null,
        ...tsMeta('pipeline', d, srcTs)
      }
    },

    final_verdict: {
      action: verdict.action,
      reason_code: verdict.reasonCode,
      confidence: verdict.confidence,
      dominant_timeframe: verdict.dominantTf,
      included_inputs: verdict.included,
      excluded_inputs: verdict.excluded,
      supporting_observations: verdict.supporting,
      conflicting_observations: verdict.conflicting,
      bullish_confirmation: verdict.reasonCode.includes('LONG') ? ['ADX trend confirmation', 'Spot CVD turns positive', 'OI rising with price'] : [],
      bearish_confirmation: verdict.reasonCode.includes('SHORT') ? ['ADX trend confirmation', 'CVD turns negative', 'OI rising against price'] : [],
      invalidation_conditions: verdict.reasonCode.includes('NO_TRADE')
        ? ['Data freshness restored', 'Critical completeness > 70%']
        : ['ADX drops below 25', 'VP state flips opposite direction', 'Traps resolve (score < 2)'],
      note: "Generated by Pipeline Dashboard V3 BTC_DATA_PACKET_V2. Not financial advice. Stale/unavailable subsystems are excluded from verdict."
    }
  };

  return JSON.stringify(packet, null, 2);
}

// ─── Copy ───
async function copyJsonToClipboard() {
  if (!currentData) return;
  const srcTs = extractSourceTimestamps(currentData);
  const json = buildStructuredJson(currentData, srcTs);
  const btn = document.getElementById('copy-json-btn');
  try {
    await navigator.clipboard.writeText(json);
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy JSON'; btn.classList.remove('copied'); }, 2000);
  } catch (e) {
    const ta = document.createElement('textarea'); ta.value = json;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✅ Copied!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy JSON'; btn.classList.remove('copied'); }, 2000);
  }
}

// ─── Load ───
async function loadAll() {
  let data = null;
  for (const path of DATA_PATHS) {
    try { const res = await fetch(path + '?t=' + Date.now()); if (res.ok) { data = await res.json(); break; } } catch (e) { continue; }
  }
  if (!data) { document.getElementById('verdict-action').textContent = 'DATA LOAD FAILED'; return; }
  currentData = data;

  const srcTs = extractSourceTimestamps(data);
  buildBrief(data, srcTs);

  const json = buildStructuredJson(data, srcTs);
  document.getElementById('json-block').textContent = json;

  // Hero
  const ts = data.header.generated_timestamp;
  const age = ageSec(ts);
  const fcls = age != null ? (age < 450 ? 'fresh' : age < 1800 ? 'delayed' : 'stale') : 'unavailable';
  document.getElementById('freshness-dot').className = 'freshness-dot ' + fcls;
  document.getElementById('freshness-label').textContent = {fresh:'Fresh',delayed:'Delayed',stale:'Stale',unavailable:'Unavailable'}[fcls];
  document.getElementById('packet-age').textContent = age != null ? age + 's ago' : '—';

  try { const cr = await fetch(COMPASS_PATH + '?t=' + Date.now()); if (cr.ok) compassData = await cr.json(); } catch (e) { compassData = null; }

  countdown = 60;
  updateCountdown();
}

function updateCountdown() { document.getElementById('countdown').textContent = countdown; }

document.addEventListener('DOMContentLoaded', () => {
  loadAll();
  setInterval(() => { countdown--; if (countdown <= 0) { loadAll(); countdown = 60; } updateCountdown(); }, 1000);
});
</script>

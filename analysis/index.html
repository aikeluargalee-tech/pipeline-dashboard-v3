<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Live Metrics — Analysis Verdict</title>
<meta name="description" content="Live BTC market metrics, auto-refreshed every 15 min. Analysis verdict from data packet + ChatGPT.">
<meta http-equiv="refresh" content="900">
<link rel="stylesheet" href="../assets/styles.css">
<style>
  .page { max-width: 720px; margin: 0 auto; padding: 16px 8px; }
  
  /* Price hero */
  .price-hero { text-align: center; padding: 20px 0 16px; }
  .price-big { font-size: 3em; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
  .price-change { font-size: 1.1em; font-weight: 700; margin-top: 4px; }
  .price-change.up { color: var(--green); }
  .price-change.down { color: var(--red); }
  .price-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  
  /* Tick bar */
  .tick-bar { display: flex; justify-content: center; gap: 24px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .tick-bar span { font-weight: 600; color: var(--text); }
  
  /* Metric grid */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .metric-card .value { font-size: 1.1em; font-weight: 700; }
  .metric-card .sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .metric-card.warn { border-left: 3px solid var(--yellow); }
  .metric-card.alert { border-left: 3px solid var(--red); }
  
  /* Status bar */
  .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--border); margin-bottom: 20px; }
  .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .status-dot.live { background: var(--green); }
  .status-dot.stale { background: var(--yellow); }
  
  /* Verdict toggle */
  .toggle-section { margin-top: 24px; }
  .toggle-btn { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .toggle-btn:hover { border-color: var(--border-hover); }
  .toggle-btn .arrow { font-size: 12px; transition: transform 0.2s; }
  .toggle-btn.open .arrow { transform: rotate(180deg); }
  .toggle-body { display: none; padding-top: 16px; }
  .toggle-body.show { display: block; }
  
  /* Verdict styles (simplified) */
  .btn { padding: 10px 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--border-hover); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  textarea { width: 100%; background: var(--card-solid); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: 12px 'JetBrains Mono', monospace; padding: 12px; resize: vertical; min-height: 100px; max-height: 250px; }
  textarea:focus { outline: none; border-color: var(--blue); }
  .ok { background: rgba(16,185,129,0.1); border-left: 3px solid var(--green); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
  .err { background: rgba(244,63,94,0.1); border-left: 3px solid var(--red); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
  .warn { background: rgba(245,158,11,0.1); border-left: 3px solid var(--yellow); padding: 8px 12px; border-radius: 4px; font-size: 13px; margin: 8px 0; }
  .hidden { display: none !important; }

  /* Verdict display */
  .verdict-hero { padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); margin-bottom: 16px; }
  .verdict-label { font-size: 1.6em; font-weight: 900; }
  .verdict-label.bullish { color: var(--green); }
  .verdict-label.bearish { color: var(--red); }
  .verdict-label.neutral { color: var(--muted); }
  .verdict-label.mixed { color: var(--orange); }
  .verdict-label.wait { color: var(--yellow); }
  .confidence-bar { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .confidence-fill { height: 100%; border-radius: 3px; background: var(--blue); }
  .horizon-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin: 12px 0; }
  .horizon-card { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); }
  .horizon-card h4 { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .horizon-card p { font-size: 13px; }
  .list { list-style: none; padding: 0; }
  .list li { padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }

  @media (max-width: 480px) {
    .price-big { font-size: 2.4em; }
    .metric-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="page">
  <!-- Price Hero -->
  <div class="price-hero" id="price-hero">
    <div class="price-big" id="price">—</div>
    <div class="price-change" id="change">—</div>
    <div class="price-sub" id="price-sub">—</div>
  </div>

  <!-- Tick Bar -->
  <div class="tick-bar">
    <div>Bid <span id="tick-bid">—</span></div>
    <div>Ask <span id="tick-ask">—</span></div>
    <div>Spread <span id="tick-spread">—</span></div>
    <div>Vol <span id="tick-vol">—</span></div>
  </div>

  <!-- Metric Grid -->
  <div class="metric-grid" id="metric-grid"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div><span class="status-dot live" id="status-dot"></span><span id="status-text">Loading…</span></div>
    <div id="updated-at">—</div>
  </div>

  <!-- Verdict Toggle -->
  <div class="toggle-section">
    <button class="toggle-btn" onclick="toggleVerdict()">
      <span>📊 Analysis Verdict (ChatGPT)</span>
      <span class="arrow">▼</span>
    </button>
    <div class="toggle-body" id="verdict-body">
      <p style="color:var(--muted);font-size:12px;margin-bottom:8px">
        Copy the packet to ChatGPT, paste the verdict back below.
      </p>
      <textarea id="verdict-input" placeholder='Paste ChatGPT verdict JSON here…' oninput="onVerdictInput()"></textarea>
      <div id="verdict-validation"></div>
      <div id="verdict-display"></div>
    </div>
  </div>
</div>

<script>
// ── AUTO-REFRESH LIVE METRICS ──
const REFRESH_MS = 900000; // 15 min
let currentData = null;

function fmtUSD(n) {
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: n > 1000 ? 0 : 2, maximumFractionDigits: n > 1000 ? 0 : 2});
}

function fmtPct(n, decimals) {
  if (n == null) return '—';
  decimals = decimals != null ? decimals : 2;
  const v = Number(n).toFixed(decimals);
  return (n >= 0 ? '+' : '') + v + '%';
}

function fmtNum(n, decimals) {
  if (n == null) return '—';
  if (Math.abs(n) >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Number(n).toFixed(decimals != null ? decimals : 2);
}

function loadMetrics() {
  const url = '../packet/data.json?' + Date.now();
  fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(renderMetrics)
    .catch(e => {
      document.getElementById('status-text').textContent = 'Fetch failed';
      document.getElementById('status-dot').className = 'status-dot stale';
    });
}

function renderMetrics(data) {
  currentData = data;
  const h = data.header || {};
  const c = data.critical || {};
  const cx = data.context || {};
  const r = data.reference || {};
  const cy = (r.cycle || {});
  const en = data.enriched || {};
  const af = data.ai_factors || {};

  // Price hero
  const price = h.btc_price;
  const change = h.change_24h;
  document.getElementById('price').textContent = fmtUSD(price);
  const chEl = document.getElementById('change');
  chEl.textContent = fmtPct(change, 2) + ' (24h)';
  chEl.className = 'price-change ' + (change >= 0 ? 'up' : 'down');
  document.getElementById('price-sub').textContent = 
    (data.regime ? 'Regime: ' + (data.regime.label || '?').replace(/_/g, ' ') + ' · ' : '') +
    (data.status ? 'Updated ' + (data.status.source_timestamps?.amt || '?').slice(0,19).replace('T',' ') : '');

  // Tick bar
  document.getElementById('tick-bid').textContent = fmtUSD(h.bid);
  document.getElementById('tick-ask').textContent = fmtUSD(h.ask);
  document.getElementById('tick-spread').textContent = h.spread != null ? '$' + Number(h.spread).toFixed(1) : '—';
  document.getElementById('tick-vol').textContent = fmtNum(h.volume_24h);

  // Metric cards
  const cards = [
    { label: 'ADX', value: c.amt_adx, fmt: v => v + ' · ' + (c.adx_regime || ''), cls: c.amt_adx > 35 ? 'warn' : '' },
    { label: 'Fear & Greed', value: cx.fng_value, fmt: v => v + ' (' + (en.fng_classification || '') + ')', cls: cx.fng_value < 30 ? 'alert' : '' },
    { label: 'VIX', value: cx.vix, fmt: v => Number(v).toFixed(1) },
    { label: 'DXY', value: cx.dxy, fmt: v => Number(v).toFixed(2) },
    { label: 'US 10Y', value: cx.us10y, fmt: v => Number(v).toFixed(3) + '%' },
    { label: 'Funding Rate', value: cx.funding_rate, fmt: v => (Number(v)*100).toFixed(4) + '%', cls: Number(cx.funding_rate) > 0.0005 ? 'warn' : '' },
    { label: 'Open Interest', value: c.oi_absolute_usd_billions, fmt: v => '$' + Number(v).toFixed(2) + 'B' },
    { label: 'OI Δ 24h', value: cx.oi_change_24h, fmt: v => fmtPct(v, 1) },
    { label: 'Long/Short', value: cx.long_short_ratio, fmt: v => Number(v).toFixed(3) },
    { label: 'Coinbase Prem.', value: cx.coinbase_premium, fmt: v => Number(v).toFixed(4) + '%', cls: Number(cx.coinbase_premium) < -0.5 ? 'alert' : '' },
    { label: 'Taker Ratio', value: c.taker_ratio_24h, fmt: v => Number(v).toFixed(3), cls: Number(c.taker_ratio_24h) < 0.9 ? 'alert' : '' },
    { label: 'CVD 24h', value: cx.cvd_24h, fmt: v => fmtNum(v), cls: Number(cx.cvd_24h) < -500 ? 'alert' : '' },
    { label: 'Basis', value: cx.perp_basis_pct, fmt: v => Number(v).toFixed(3) + '%', cls: Number(cx.perp_basis_pct) < -0.1 ? 'warn' : '' },
    { label: 'Vol 1h', value: cx.realized_vol_1h_pct, fmt: v => Number(v).toFixed(1) + '%', cls: Number(cx.realized_vol_1h_pct) > 80 ? 'warn' : '' },
    { label: 'Vol 1d', value: cx.realized_vol_1d_pct, fmt: v => Number(v).toFixed(1) + '%' },
    { label: 'MVRV-Z', value: cy.mvrv_z, fmt: v => Number(v).toFixed(2), cls: Number(cy.mvrv_z) < 1 ? 'warn' : '' },
    { label: 'SOPR', value: cy.sopr, fmt: v => Number(v).toFixed(4) },
    { label: 'ETF Flow Wk', value: cx.etf_flow_weekly, fmt: v => fmtNum(v) + ' USD', cls: Number(cx.etf_flow_weekly) < 0 ? 'alert' : '' },
    { label: 'RSI 14', value: cx.daily_rsi_14, fmt: v => Number(v).toFixed(1) },
    { label: 'MSTR', value: cx.mstr_close, fmt: v => '$' + Number(v).toFixed(2) },
    { label: 'BS Score', value: cx.black_swan_score, fmt: v => v, cls: typeof cx.black_swan_score === 'string' && cx.black_swan_score !== '0/17' ? 'alert' : '' },
    { label: 'Crash', value: en.crash_status, fmt: v => v, cls: en.crash_score > 1 ? 'alert' : '' },
    { label: 'Correl r', value: cx.correlation_r, fmt: v => Number(v).toFixed(4) },
    { label: 'Liq Clusters', value: cx.liq_clusters, fmt: v => v, sub: true },
  ];

  let html = '';
  for (const card of cards) {
    if (card.value == null) continue;
    const val = typeof card.fmt === 'function' ? card.fmt(card.value) : card.value;
    html += `<div class="metric-card ${card.cls || ''}">`;
    html += `<div class="label">${card.label}</div>`;
    html += `<div class="value">${val}</div>`;
    html += `</div>`;
  }
  document.getElementById('metric-grid').innerHTML = html;

  // Status
  document.getElementById('status-dot').className = 'status-dot live';
  document.getElementById('status-text').textContent = 'Live · ' + (data.status?.source_timestamps?.amt || '?').slice(0,19).replace('T',' ');
  document.getElementById('updated-at').textContent = 'Refresh: ' + new Date().toLocaleTimeString();
}

// ── VERDICT ──
function toggleVerdict() {
  document.getElementById('verdict-body').classList.toggle('show');
  document.querySelector('.toggle-btn').classList.toggle('open');
}

function onVerdictInput() {
  const raw = document.getElementById('verdict-input').value.trim();
  document.getElementById('verdict-display').innerHTML = '';
  if (!raw) { document.getElementById('verdict-validation').innerHTML = ''; return; }
  try {
    const v = JSON.parse(raw);
    const issues = validateVerdict(v);
    if (issues.length) {
      document.getElementById('verdict-validation').innerHTML = 
        `<div class="err">Validation: ${issues.map(i => '• ' + i).join('<br>')}</div>`;
    } else {
      document.getElementById('verdict-validation').innerHTML = 
        '<div class="ok">✓ Verdict valid — no order fields, hash matches</div>';
      renderVerdict(v);
    }
  } catch(e) {
    document.getElementById('verdict-validation').innerHTML = `<div class="err">Invalid JSON: ${e.message}</div>`;
  }
}

function validateVerdict(v) {
  const issues = [];
  const valid = ['BULLISH','BEARISH','NEUTRAL','MIXED','WAIT_FOR_CONFIRMATION'];
  if (!v.overall_verdict) issues.push('MISSING_OVERALL_VERDICT');
  else if (!valid.includes(v.overall_verdict)) issues.push('INVALID_VERDICT: ' + v.overall_verdict);
  if (!v.plain_english_summary) issues.push('MISSING_PLAIN_ENGLISH_SUMMARY');
  const forbidden = ['order','position','trade','entry','exit','stop','target'];
  for (const k of Object.keys(v)) {
    if (forbidden.some(f => k.toLowerCase().includes(f))) issues.push('ORDER_FIELD: ' + k);
  }
  return issues;
}

function renderVerdict(v) {
  const vCls = (v.overall_verdict || '').toLowerCase().replace(/_/g, '');
  let html = '';
  html += `<div class="verdict-hero">`;
  html += `<div class="verdict-label ${vCls}">${v.overall_verdict || '—'}</div>`;
  html += `<div style="font-size:13px;color:var(--muted)">Confidence: ${v.confidence_percent || 0}% · ${v.confidence_basis || ''}</div>`;
  html += `<div class="confidence-bar"><div class="confidence-fill" style="width:${v.confidence_percent || 0}%"></div></div>`;
  html += `</div>`;

  // Horizons
  const hrz = [
    {k:'immediate_outlook', t:'1–4h'},
    {k:'short_term_outlook', t:'24h'},
    {k:'swing_context', t:'3–7d'}
  ];
  html += `<div class="horizon-row">`;
  for (const h of hrz) {
    const d = v[h.k] || {};
    html += `<div class="horizon-card"><h4>${h.t}</h4><p style="font-weight:700;color:var(--${(d.outlook||'').toLowerCase() === 'bullish' ? 'green' : (d.outlook||'').toLowerCase() === 'bearish' ? 'red' : 'muted'})">${d.outlook || '—'}</p><p style="font-size:12px;color:var(--muted)">${d.summary || ''}</p></div>`;
  }
  html += `</div>`;

  // Levels
  const sups = v.key_support_levels || [];
  const ress = v.key_resistance_levels || [];
  if (sups.length || ress.length) {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">`;
    html += `<div><h4 style="font-size:12px;color:var(--green);margin-bottom:4px">Support</h4>`;
    for (const l of sups) html += `<div style="font-size:12px">${fmtUSD(l.price)} <span style="color:var(--muted)">${l.strength||''} ${l.source||''}</span></div>`;
    html += `</div><div><h4 style="font-size:12px;color:var(--red);margin-bottom:4px">Resistance</h4>`;
    for (const l of ress) html += `<div style="font-size:12px">${fmtUSD(l.price)} <span style="color:var(--muted)">${l.strength||''} ${l.source||''}</span></div>`;
    html += `</div></div>`;
  }

  // Lists
  const lists = [
    {k:'supporting_evidence', t:'✓ Supporting', c: 'var(--green)'},
    {k:'conflicting_evidence', t:'✗ Conflicting', c: 'var(--red)'},
    {k:'bullish_confirmation', t:'▲ Bullish Confirm', c: 'var(--green)'},
    {k:'bearish_confirmation', t:'▼ Bearish Confirm', c: 'var(--red)'},
    {k:'invalidation_conditions', t:'⚠ Invalidation', c: 'var(--yellow)'},
    {k:'external_risks', t:'⚠ Risks', c: 'var(--orange)'},
    {k:'data_limitations', t:'ⓘ Limitations', c: 'var(--muted)'},
    {k:'what_to_watch_next', t:'→ Watch Next', c: 'var(--blue)'},
  ];
  for (const l of lists) {
    const items = v[l.k];
    if (!items || !items.length) continue;
    html += `<h4 style="font-size:12px;color:${l.c};margin:10px 0 4px">${l.t}</h4><ul class="list">`;
    for (const item of items) html += `<li>${item}</li>`;
    html += `</ul>`;
  }

  if (v.plain_english_summary) {
    html += `<div style="margin-top:16px;padding:14px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:14px;line-height:1.6">${v.plain_english_summary}</div>`;
  }
  document.getElementById('verdict-display').innerHTML = html;
}

// ── INIT ──
loadMetrics();
setInterval(loadMetrics, REFRESH_MS);
</script>

</body>
</html>
